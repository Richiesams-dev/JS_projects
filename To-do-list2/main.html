<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <header>
            <h1>My Ultimate To-Do List</h1>
            <button id="dark-mode-toggle">
                <i class="fas fa-moon"></i> Dark Mode
            </button>
        </header>

        <div class="input-group">
            <input type="text" id="input" placeholder="Add a new task...">
            <select id="category">
                <option value="general">General</option>
                <option value="work">Work</option>
                <option value="personal">Personal</option>
                <option value="shopping">Shopping</option>
            </select>
            <input type="date" id="due-date">
            <button id="add-btn"><i class="fas fa-plus"></i> Add</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="work">Work</button>
            <button class="filter-btn" data-filter="personal">Personal</button>
            <button class="filter-btn" data-filter="shopping">Shopping</button>
        </div>

        <ul id="list"></ul>
        <p id="empty-message">No tasks yet. Add one above!</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
